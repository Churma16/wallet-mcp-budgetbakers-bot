services:
  wallet-mcp-bot:
    build:
      context: .
    env_file:
      - .env
    restart: unless-stopped
    init: true
    stdin_open: true
    tty: true
    volumes:
      - whatsapp_auth:/app/auth_session
      - app_data:/app/data
      - app_logs:/app/logs
    stop_grace_period: 30s

volumes:
  whatsapp_auth:
  app_data:
  app_logs:
