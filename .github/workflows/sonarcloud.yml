# This workflow uses actions that are not certified by GitHub.
# They are provided by a third-party and are governed by
# separate terms of service, privacy policy, and support
# documentation.

# This workflow helps you trigger a SonarCloud analysis of your code and populates
# GitHub Code Scanning alerts with the vulnerabilities found.
# Free for open source project.

# 1. Login to SonarCloud.io using your GitHub account

# 2. Import your project on SonarCloud
#     * Add your GitHub organization first, then add your repository as a new project.
#     * Please note that many languages are eligible for automatic analysis,
#       which means that the analysis will start automatically without the need to set up GitHub Actions.
#     * This behavior can be changed in Administration > Analysis Method.
#
# 3. Follow the SonarCloud in-product tutorial
#     * a. Copy/paste the Project Key and the Organization Key into the args parameter below
#          (You'll find this information in SonarCloud. Click on "Information" at the bottom left)
#
#     * b. Generate a new token and add it to your Github repository's secrets using the name SONAR_TOKEN
#          (On SonarCloud, click on your avatar on top-right > My account > Security
#           or go directly to https://sonarcloud.io/account/security/)

# Feel free to take a look at our documentation (https://docs.sonarcloud.io/getting-started/github/)
# or reach out to our community forum if you need some help (https://community.sonarsource.com/c/help/sc/9)

name: SonarCloud analysis

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  pull-requests: read # allows SonarCloud to decorate PRs with analysis results
  security-events: write # allows SonarCloud to populate GitHub Code Scanning alerts
  contents: read
  actions: read

jobs:
  Analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Diagnose PR changed-code coverage
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const { execFileSync } = require('child_process');

          const coverageFiles = ['coverage/legacy/lcov.info', 'coverage/vitest/lcov.info'];
          const records = new Map();

          function normalizedSource(raw) {
            const value = raw.replace(/\\/g, '/');
            const marker = value.lastIndexOf('/src/');
            return marker >= 0 ? value.slice(marker + 1) : value.replace(/^\.\//, '');
          }

          for (const coverageFile of coverageFiles) {
            if (!fs.existsSync(coverageFile)) continue;
            let current;
            for (const line of fs.readFileSync(coverageFile, 'utf8').split(/\r?\n/)) {
              if (line.startsWith('SF:')) {
                current = normalizedSource(line.slice(3));
                if (!records.has(current)) records.set(current, { lines: new Map(), branches: new Map() });
                continue;
              }
              if (!current) continue;
              const record = records.get(current);
              if (line.startsWith('DA:')) {
                const [lineNoRaw, countRaw] = line.slice(3).split(',');
                const lineNo = Number(lineNoRaw);
                const count = Number(countRaw);
                record.lines.set(lineNo, (record.lines.get(lineNo) || 0) + count);
              } else if (line.startsWith('BRDA:')) {
                const [lineNoRaw, block, branch, takenRaw] = line.slice(5).split(',');
                const lineNo = Number(lineNoRaw);
                const key = `${lineNo}:${block}:${branch}`;
                const taken = takenRaw === '-' ? 0 : Number(takenRaw);
                record.branches.set(key, (record.branches.get(key) || 0) + taken);
              } else if (line === 'end_of_record') {
                current = undefined;
              }
            }
          }

          const diff = execFileSync('git', [
            'diff', '--unified=0', 'origin/main...HEAD', '--', 'src'
          ], { encoding: 'utf8' });

          const added = new Map();
          let file;
          for (const line of diff.split(/\r?\n/)) {
            if (line.startsWith('+++ b/')) {
              file = line.slice(6);
              if (!added.has(file)) added.set(file, new Set());
              continue;
            }
            const match = line.match(/^@@ -\d+(?:,\d+)? \+(\d+)(?:,(\d+))? @@/);
            if (!match || !file) continue;
            const start = Number(match[1]);
            const count = match[2] === undefined ? 1 : Number(match[2]);
            for (let i = 0; i < count; i += 1) added.get(file).add(start + i);
          }

          let totalExecutable = 0;
          let totalUncoveredLines = 0;
          let totalBranches = 0;
          let totalUncoveredBranches = 0;
          console.log('=== PR #155 changed-code LCOV diagnosis ===');
          for (const [path, changedLines] of added) {
            const record = records.get(path);
            if (!record) continue;
            const executable = [...changedLines].filter(lineNo => record.lines.has(lineNo));
            const uncoveredLines = executable.filter(lineNo => (record.lines.get(lineNo) || 0) === 0);
            const changedBranches = [...record.branches.entries()].filter(([key]) => changedLines.has(Number(key.split(':')[0])));
            const uncoveredBranches = changedBranches.filter(([, taken]) => taken === 0);
            if (executable.length === 0 && changedBranches.length === 0) continue;

            totalExecutable += executable.length;
            totalUncoveredLines += uncoveredLines.length;
            totalBranches += changedBranches.length;
            totalUncoveredBranches += uncoveredBranches.length;

            console.log(`\n${path}`);
            console.log(`  executable added lines: ${executable.length}, uncovered: ${uncoveredLines.length}`);
            if (uncoveredLines.length) console.log(`  uncovered lines: ${uncoveredLines.join(', ')}`);
            console.log(`  changed branches: ${changedBranches.length}, uncovered: ${uncoveredBranches.length}`);
            if (uncoveredBranches.length) console.log(`  uncovered branches: ${uncoveredBranches.map(([key]) => key).join(', ')}`);
          }

          const denominator = totalExecutable + totalBranches;
          const covered = denominator - totalUncoveredLines - totalUncoveredBranches;
          console.log('\n=== totals ===');
          console.log({
            totalExecutable,
            totalUncoveredLines,
            totalBranches,
            totalUncoveredBranches,
            approximateCombinedCoverage: denominator ? `${(covered / denominator * 100).toFixed(1)}%` : 'n/a',
          });
          NODE

      - name: Analyze with SonarQube Cloud
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Churma16_wallet-mcp-budgetbakers-bot
            -Dsonar.organization=churma16
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.coverage.exclusions=src/cli/**
            -Dsonar.javascript.lcov.reportPaths=coverage/legacy/lcov.info,coverage/vitest/lcov.info
          projectBaseDir: .
