name: PR 133 runtime contract fix

on:
  push:
    paths:
      - .github/workflows/pr133-runtime-contract-fix.yml

permissions:
  contents: write

jobs:
  patch-verify-and-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/interactive-setup-doctor-compose
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Align supported runtime and Telegram template contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old!r}")
              p.write_text(text.replace(old, new))

          replace_exact(
              'README.md',
              'Node.js-%3E=18.0.0-339933',
              'Node.js-%3E=22.0.0-339933',
          )
          replace_exact(
              'README.md',
              '**Language & Runtime**: TypeScript 5.x on Node.js (tested on LTS v18 and v20+ via `tsx`)',
              '**Language & Runtime**: TypeScript 5.x on Node.js 22+ via `tsx`',
          )
          replace_exact(
              'README.md',
              '**Node.js**: Version 18.0.0 or higher.',
              '**Node.js**: Version 22.0.0 or higher.',
          )

          setup_doc = Path('docs/setup-and-diagnostics.md')
          setup_text = setup_doc.read_text()
          marker = '# Setup and Diagnostics\n\n'
          runtime_note = '> **Runtime prerequisite:** Node.js 22 or newer. This matches the package metadata, doctor diagnostic, CI runtime, and container image.\n\n'
          if runtime_note not in setup_text:
              if marker not in setup_text:
                  raise SystemExit('Setup guide header not found')
              setup_doc.write_text(setup_text.replace(marker, marker + runtime_note, 1))

          replace_exact(
              '.env.example',
              '# Authorized Telegram User ID or Username (whitelist security). Obtain ID from @userinfobot or @raw_data_bot',
              '# Authorized immutable numeric Telegram User ID (whitelist security). Obtain it from @userinfobot or @raw_data_bot. Usernames such as @username are not supported.',
          )

          package = Path('package.json')
          package_text = package.read_text()
          package_marker = '    "type": "module",\n    "scripts": {'
          package_replacement = '    "type": "module",\n    "engines": {\n        "node": ">=22"\n    },\n    "scripts": {'
          if '"engines"' not in package_text:
              if package_marker not in package_text:
                  raise SystemExit('package.json insertion point not found')
              package.write_text(package_text.replace(package_marker, package_replacement, 1))

          doctor = Path('src/diagnostics/doctorService.ts')
          doctor_text = doctor.read_text()
          type_marker = "export type DoctorStatus = 'SUCCESS' | 'WARN' | 'ERROR';\n"
          constant = 'export const MINIMUM_SUPPORTED_NODE_MAJOR_VERSION = 22;\n\n'
          if 'MINIMUM_SUPPORTED_NODE_MAJOR_VERSION' not in doctor_text:
              if type_marker not in doctor_text:
                  raise SystemExit('doctor runtime constant insertion point not found')
              doctor_text = doctor_text.replace(type_marker, type_marker + '\n' + constant, 1)
          doctor_text = doctor_text.replace(
              'Number.isFinite(nodeMajorVersion) && nodeMajorVersion >= 22',
              'Number.isFinite(nodeMajorVersion) && nodeMajorVersion >= MINIMUM_SUPPORTED_NODE_MAJOR_VERSION',
          )
          doctor_text = doctor_text.replace(
              'message: `Node.js 22 or newer is required; current version is ${dependencies.nodeVersion}.`,',
              'message: `Node.js ${MINIMUM_SUPPORTED_NODE_MAJOR_VERSION} or newer is required; current version is ${dependencies.nodeVersion}.`,',
          )
          doctor.write_text(doctor_text)
          PY

      - name: Sync lockfile metadata
        run: npm install --package-lock-only --ignore-scripts

      - name: Verify clean install and contracts
        shell: bash
        run: |
          npm ci --ignore-scripts
          node - <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          if (manifest.engines?.node !== '>=22') throw new Error('package.json Node engine drift');
          if (lock.packages?.['']?.engines?.node !== '>=22') throw new Error('package-lock Node engine drift');
          const readme = fs.readFileSync('README.md', 'utf8');
          if (!readme.includes('Node.js-%3E=22.0.0-339933')) throw new Error('README Node badge drift');
          if (!readme.includes('**Node.js**: Version 22.0.0 or higher.')) throw new Error('README prerequisite drift');
          const setup = fs.readFileSync('docs/setup-and-diagnostics.md', 'utf8');
          if (!setup.includes('Node.js 22 or newer')) throw new Error('setup guide runtime drift');
          const env = fs.readFileSync('.env.example', 'utf8');
          if (!env.includes('immutable numeric Telegram User ID')) throw new Error('Telegram template numeric-ID wording missing');
          if (!env.includes('Usernames such as @username are not supported')) throw new Error('Telegram template unsupported-username wording missing');
          NODE
          npm run build
          npm run test:offline
          npm run test:vitest

      - name: Commit verified fixes and remove helper
        shell: bash
        run: |
          rm .github/workflows/pr133-runtime-contract-fix.yml
          git config user.name "Fathan Muhammad Faqih"
          git config user.email "74785057+Churma16@users.noreply.github.com"
          git add README.md .env.example docs/setup-and-diagnostics.md package.json package-lock.json src/diagnostics/doctorService.ts .github/workflows/pr133-runtime-contract-fix.yml
          git commit -m "fix(dx): align runtime and Telegram setup contracts"
          git push origin HEAD:feature/interactive-setup-doctor-compose
