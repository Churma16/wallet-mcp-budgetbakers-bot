name: Manual Release

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: 'Release type (auto determines from conventional commits)'
        required: false
        default: 'auto'
        type: choice
        options:
          - 'auto'
          - 'patch'
          - 'minor'
          - 'major'
      dry_run:
        description: 'Dry run (simulate version bump and release notes without pushing tags/releases)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  pull-requests: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci --ignore-scripts

      - name: Verify Build
        run: npm run build

      - name: Run Tests
        run: npm test

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Bump Version and Update Changelog
        id: bump
        env:
          RELEASE_TYPE: ${{ inputs.release_type }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          EXTRA_ARGS=""
          if [ "$RELEASE_TYPE" != "auto" ]; then
            EXTRA_ARGS="--release-as $RELEASE_TYPE"
          fi
          if [ "$DRY_RUN" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --dry-run"
          fi

          echo "[INFO] Running commit-and-tag-version with args: $EXTRA_ARGS"
          npx -y commit-and-tag-version $EXTRA_ARGS

          if [ "$DRY_RUN" = "false" ]; then
            NEW_TAG=$(git describe --tags --abbrev=0)
            echo "RELEASE_TAG=$NEW_TAG" >> $GITHUB_ENV
            echo "[INFO] Generated new tag: $NEW_TAG"
          fi

      - name: Push Version Bump and Tag
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}
          BRANCH=${{ github.ref_name }}
          git push origin $BRANCH --follow-tags

      - name: Generate Release Notes
        if: ${{ inputs.dry_run == false }}
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ env.RELEASE_TAG }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: node .github/scripts/generate-release-notes.js

      - name: Publish GitHub Release
        if: ${{ inputs.dry_run == false }}
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body_path: release-notes.md
          prerelease: false
