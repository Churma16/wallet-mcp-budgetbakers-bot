name: Create Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate Release Notes with Contributor Mentions
        id: notes
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN || secrets.GITHUB_TOKEN }}
          TAG_NAME: ${{ github.ref_name }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          node -e "
          const fs = require('fs');
          const https = require('https');
          const { execSync } = require('child_process');

          const repo = process.env.GITHUB_REPOSITORY;
          const token = process.env.GH_TOKEN;
          const tagName = process.env.TAG_NAME || '';
          const version = tagName.replace(/^v/, '');

          function requestGitHub(path) {
            return new Promise((resolve) => {
              const options = {
                hostname: 'api.github.com',
                path: '/repos/' + repo + path,
                headers: {
                  'User-Agent': 'release-notes-generator',
                  ...(token ? { 'Authorization': 'token ' + token } : {})
                }
              };
              https.get(options, (res) => {
                let data = '';
                res.on('data', chunk => data += chunk);
                res.on('end', () => {
                  try {
                    resolve(JSON.parse(data));
                  } catch {
                    resolve(null);
                  }
                });
              }).on('error', () => resolve(null));
            });
          }

          async function main() {
            let releaseBody = '';

            // 1. Ekstrak bagian versi ini dari CHANGELOG.md jika ada
            if (fs.existsSync('CHANGELOG.md')) {
              const changelog = fs.readFileSync('CHANGELOG.md', 'utf8').replace(/\r\n/g, '\n');
              const escaped = version.replace(/\./g, '\\.');
              const regex = new RegExp('(?:^|\\n)##\\s*\\[?' + escaped + '[\\]\\s][^\\n]*\\n([\\s\\S]*?)(?=\\n##\\s|$)');
              const match = changelog.match(regex);
              if (match && match[1].trim()) {
                releaseBody = match[1].trim();
              }
            }

            // 2. Ambil list PR dan commit dari git history untuk versi ini
            const contributors = new Set();
            const changelogEntries = [];

            try {
              const prevTag = execSync('git describe --tags --abbrev=0 \"' + tagName + '^\" 2>/dev/null || true', { encoding: 'utf8' }).trim();
              const revRange = prevTag ? (prevTag + '..' + tagName) : tagName;
              const rawCommits = execSync('git log --pretty=format:\"%h%x09%an%x09%s\" ' + revRange, { encoding: 'utf8' }).trim();

              if (rawCommits) {
                const commitLines = rawCommits.split('\n').filter(Boolean);

                for (const line of commitLines) {
                  const parts = line.split('\t');
                  const hash = parts[0];
                  const authorName = parts[1];
                  const subject = parts.slice(2).join('\t');

                  // Lewati commit otomatis rilis bot
                  if (subject.startsWith('chore(release):')) continue;

                  // Cek apakah commit berasal dari PR (misal #13 atau (#13))
                  const prMatch = subject.match(/\(#?(\d+)\)|#(\d+)/);
                  if (prMatch) {
                    const prNumber = prMatch[1] || prMatch[2];
                    const prData = await requestGitHub('/pulls/' + prNumber);
                    const authorLogin = prData && prData.user ? prData.user.login : null;

                    if (authorLogin) {
                      contributors.add('@' + authorLogin);
                      changelogEntries.push('* ' + subject + ' by @' + authorLogin + ' in #' + prNumber);
                    } else {
                      changelogEntries.push('* ' + subject + ' in #' + prNumber);
                    }
                  } else {
                    // Direct commit tanpa PR
                    const commitData = await requestGitHub('/commits/' + hash);
                    const authorLogin = commitData && commitData.author ? commitData.author.login : null;

                    if (authorLogin) {
                      contributors.add('@' + authorLogin);
                      changelogEntries.push('* ' + subject + ' by @' + authorLogin + ' (' + hash + ')');
                    } else {
                      changelogEntries.push('* ' + subject + ' by ' + authorName + ' (' + hash + ')');
                    }
                  }
                }
              }
            } catch (error) {
              console.error('[WARN] Could not retrieve commit details:', error.message);
            }

            // 3. Susun dokumen release notes yang menghargai kontributor
            let finalNotes = '';

            if (releaseBody) {
              finalNotes += releaseBody + '\n\n';
            }

            if (changelogEntries.length > 0) {
              finalNotes += '### What\'s Changed\n\n' + changelogEntries.join('\n') + '\n\n';
            }

            if (contributors.size > 0) {
              finalNotes += '### Contributors\n\n' + Array.from(contributors).join(', ') + '\n';
            }

            fs.writeFileSync('release-notes.md', finalNotes.trim() || 'No notable changes.');
          }

          main().catch(err => {
            console.error('[ERROR] Failed generating notes:', err);
            fs.writeFileSync('release-notes.md', 'No notable changes.');
          });
          "

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ startsWith(github.ref_name, 'v0.') }}
