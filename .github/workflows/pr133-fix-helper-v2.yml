name: PR 133 follow-up fix helper v2

on:
  push:
    branches:
      - feature/interactive-setup-doctor-compose
    paths:
      - .github/workflows/pr133-fix-helper-v2.yml

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/interactive-setup-doctor-compose
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Patch setup validation and regression coverage
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one {label} match, found {count}")
              return text.replace(old, new, 1)

          setup_path = Path('src/setup/setupWizard.ts')
          setup = setup_path.read_text()
          setup = replace_once(
              setup,
              "import {\n  normalizePhoneNumber,\n  SupportedAiProviderType,\n} from '../config/environmentConfig.js';",
              "import {\n  isValidIanaTimezone,\n  normalizePhoneNumber,\n  SupportedAiProviderType,\n} from '../config/environmentConfig.js';",
              'environmentConfig import',
          )

          marker = """function resolveExistingProviderKey(\n"""
          helpers = """async function promptTelegramAllowedUserId(\n  prompter: SetupPrompter,\n  existingValue?: string\n): Promise<string> {\n  let defaultValue = existingValue?.trim().replace(/^@/, '');\n\n  while (true) {\n    const enteredValue = await promptRequiredText(\n      prompter,\n      'Authorized Telegram user ID',\n      defaultValue\n    );\n    const canonicalValue = enteredValue.trim().replace(/^@/, '');\n    if (/^\\d+$/.test(canonicalValue)) {\n      return canonicalValue;\n    }\n\n    prompter.info(\n      '[WARN] Enter the immutable numeric Telegram user ID only (for example 123456789); usernames are not supported.'\n    );\n    defaultValue = undefined;\n  }\n}\n\nasync function promptValidIanaTimezone(\n  prompter: SetupPrompter,\n  existingValue?: string\n): Promise<string> {\n  let defaultValue: string | undefined = existingValue || 'Asia/Jakarta';\n\n  while (true) {\n    const enteredValue = await promptRequiredText(\n      prompter,\n      'Application timezone (IANA identifier)',\n      defaultValue\n    );\n    if (isValidIanaTimezone(enteredValue)) {\n      return enteredValue;\n    }\n\n    prompter.info(\n      '[WARN] Enter a valid IANA timezone identifier (for example Asia/Jakarta, America/New_York, or UTC).'\n    );\n    defaultValue = undefined;\n  }\n}\n\n"""
          setup = replace_once(setup, marker, helpers + marker, 'setup helper insertion point')

          setup = replace_once(
              setup,
              "const defaultBaseUrl = PROVIDER_DEFAULT_BASE_URL[provider] || existingValues.AI_BASE_URL || '';",
              "const defaultBaseUrl =\n          provider === 'custom'\n            ? existingPrimaryProvider === 'custom'\n              ? existingValues.AI_BASE_URL || ''\n              : ''\n            : PROVIDER_DEFAULT_BASE_URL[provider] || '';",
              'provider base URL default',
          )

          setup = replace_once(
              setup,
              """    updates.TELEGRAM_ALLOWED_USER_ID = await promptRequiredText(\n      prompter,\n      'Authorized Telegram user ID',\n      existingValues.TELEGRAM_ALLOWED_USER_ID\n    );""",
              """    updates.TELEGRAM_ALLOWED_USER_ID = await promptTelegramAllowedUserId(\n      prompter,\n      existingValues.TELEGRAM_ALLOWED_USER_ID\n    );""",
              'Telegram user ID prompt',
          )

          setup = replace_once(
              setup,
              """  updates.APP_TIMEZONE = await promptRequiredText(\n    prompter,\n    'Application timezone (IANA identifier)',\n    existingValues.APP_TIMEZONE || 'Asia/Jakarta'\n  );""",
              """  updates.APP_TIMEZONE = await promptValidIanaTimezone(\n    prompter,\n    existingValues.APP_TIMEZONE\n  );""",
              'timezone prompt',
          )
          setup_path.write_text(setup)

          test_path = Path('tests/setupWizard.vitest.test.ts')
          tests = test_path.read_text()
          tests = replace_once(
              tests,
              "import { loadEnvironmentConfiguration } from '../src/config/environmentConfig.js';",
              "import {\n  loadEnvironmentConfiguration,\n  validateApplicationConfiguration,\n} from '../src/config/environmentConfig.js';",
              'test environmentConfig import',
          )

          tests = replace_once(
              tests,
              """    'WALLET_MCP_ACCESS_TOKEN',\n    'ENABLED_MESSENGER_CHANNELS',""",
              """    'WALLET_MCP_BASE_URL',\n    'WALLET_MCP_ACCESS_TOKEN',\n    'ALLOWED_PHONE_NUMBER',\n    'TELEGRAM_BOT_TOKEN',\n    'TELEGRAM_ALLOWED_USER_ID',\n    'EMAIL_SYNC_ENABLED',\n    'ENABLED_MESSENGER_CHANNELS',""",
              'managed environment keys',
          )

          tests = replace_once(
              tests,
              "it('requires a fresh generic key when switching from a named provider to custom', async () => {",
              "it('requires fresh custom credentials and endpoint when switching from a named provider', async () => {",
              'custom-provider test title',
          )
          tests = replace_once(
              tests,
              """      AI_API_KEY: 'stale-openrouter-generic-secret',\n      OPENROUTER_API_KEY: 'openrouter-provider-secret',""",
              """      AI_API_KEY: 'stale-openrouter-generic-secret',\n      AI_BASE_URL: 'https://openrouter.ai/api/v1',\n      OPENROUTER_API_KEY: 'openrouter-provider-secret',""",
              'custom-provider existing base URL',
          )
          tests = replace_once(
              tests,
              """        'custom base URL': ['https://custom.example/v1'],""",
              """        'custom base URL': ['', 'https://custom.example/v1'],""",
              'custom-provider base URL answers',
          )
          tests = replace_once(
              tests,
              """    expect(result.updates.AI_BASE_URL).toBe('https://custom.example/v1');\n    expect(result.updates.AI_MODEL).toBe('custom-model');""",
              """    expect(result.updates.AI_BASE_URL).toBe('https://custom.example/v1');\n    expect(result.updates.AI_BASE_URL).not.toBe('https://openrouter.ai/api/v1');\n    expect(result.updates.AI_MODEL).toBe('custom-model');\n    expect(prompter.infoMessages).toContain('[WARN] A value is required.');""",
              'custom-provider assertions',
          )

          insert_before = """  it('configures Telegram, console, OpenAI, and optional email sync in one run', async () => {"""
          new_test = """  it('reprompts invalid Telegram IDs and timezones until runtime-valid values are entered', async () => {\n    const existingValues = {\n      WALLET_MCP_BASE_URL: 'https://mcp.wallet.budgetbakers.com',\n      WALLET_MCP_ACCESS_TOKEN: 'wallet-existing-secret',\n      AI_PROVIDER: 'gemini',\n      GEMINI_API_KEY: 'gemini-existing-secret',\n      ENABLED_MESSENGER_CHANNELS: 'console',\n      APP_LANGUAGE: 'id',\n      DEFAULT_CURRENCY: 'IDR',\n      APP_TIMEZONE: 'Asia/Jakarta',\n      EMAIL_SYNC_ENABLED: 'false',\n    };\n    const prompter = new FakeSetupPrompter({\n      aiProviders: ['gemini'],\n      channels: ['telegram', 'console'],\n      secrets: {\n        TELEGRAM_BOT_TOKEN: 'telegram-new-secret',\n      },\n      questionAnswers: {\n        'Authorized Telegram user ID': ['@fathan', '@123456789'],\n        'Application timezone': ['Jakarta', 'Asia/Jakarta'],\n      },\n    });\n\n    const result = await collectSetupConfiguration(prompter, existingValues);\n    const mergedValues = parseEnvFileContent(\n      mergeEnvFileContent(\n        Object.entries(existingValues)\n          .map(([key, value]) => `${key}=${value}`)\n          .join('\\n'),\n        result.updates\n      )\n    );\n    const loadedConfig = withEnvironment(mergedValues, () => loadEnvironmentConfiguration());\n    const validationResult = validateApplicationConfiguration(loadedConfig);\n\n    expect(result.updates.TELEGRAM_ALLOWED_USER_ID).toBe('123456789');\n    expect(result.updates.APP_TIMEZONE).toBe('Asia/Jakarta');\n    expect(validationResult.isValid).toBe(true);\n    expect(\n      prompter.infoMessages.some(message => message.includes('numeric Telegram user ID'))\n    ).toBe(true);\n    expect(\n      prompter.infoMessages.some(message => message.includes('valid IANA timezone identifier'))\n    ).toBe(true);\n  });\n\n"""
          tests = replace_once(tests, insert_before, new_test + insert_before, 'new validation regression test insertion point')
          test_path.write_text(tests)

          package_path = Path('package.json')
          package_text = package_path.read_text()
          package_text = replace_once(
              package_text,
              '"test:coverage:vitest": "npm install --no-save --package-lock=false @vitest/coverage-v8@5.0.0 && vitest run --coverage"',
              '"test:coverage:vitest": "vitest run --coverage"',
              'coverage script',
          )
          package_path.write_text(package_text)
          PY

      - name: Install declared coverage provider and refresh lockfile
        run: npm install --save-dev --save-exact @vitest/coverage-v8@5.0.0

      - name: Verify build and tests
        run: |
          npm run build
          npm run test:offline
          npm run test:vitest
          npm run test:coverage

      - name: Commit verified fixes and remove helper workflows
        shell: bash
        run: |
          rm .github/workflows/pr133-fix-helper.yml .github/workflows/pr133-fix-helper-v2.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/setup/setupWizard.ts tests/setupWizard.vitest.test.ts package.json package-lock.json .github/workflows/pr133-fix-helper.yml .github/workflows/pr133-fix-helper-v2.yml
          git commit -m "fix(dx): address setup wizard follow-up review"
          git push origin HEAD:feature/interactive-setup-doctor-compose
