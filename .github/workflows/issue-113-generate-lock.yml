name: Issue 113 lockfile bootstrap

on:
  push:
    branches:
      - issue-113-vitest-bootstrap

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: issue-113-vitest-bootstrap

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: 'npm'

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit generated lockfile and remove bootstrap workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git rm .github/workflows/issue-113-generate-lock.yml
          git commit -m "chore: refresh lockfile for Vitest bootstrap"
          git push origin HEAD:issue-113-vitest-bootstrap
